server:
  port: ${SERVER_PORT:8188}
  error:
    include-message: always

spring:
  application:
    name: certguard
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3317}/${DB_NAME:certguard}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USER:certguard}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  thymeleaf:
    check-template-location: false

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  frontend-url: ${FRONTEND_URL:http://localhost:5180}
  cors-origins: ${CORS_ORIGINS:http://localhost:5180,http://127.0.0.1:5180}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  expiry-check:
    # Spring cron: second minute hour day-of-month month day-of-week
    cron: ${EXPIRY_CHECK_CRON:0 0 8 * * *}
  reminders:
    default-days: ${DEFAULT_REMINDER_DAYS:30,15,7,1}
  mail:
    from-name: ${MAIL_FROM_NAME:CertGuard}
    max-attempts: 3
  ocr:
    tesseract-command: ${TESSERACT_CMD:tesseract}
  seed-demo: ${SEED_DEMO:true}
